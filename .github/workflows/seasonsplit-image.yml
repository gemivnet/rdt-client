name: Build seasonsplit rdt-client image

on:
  push:
    branches:
      - seasonsplit
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pin embedded version to latest upstream tag
        run: |
          UPSTREAM_VERSION=$(curl -fsSL https://api.github.com/repos/rogerfar/rdt-client/releases/latest | grep -oE '"tag_name":\s*"v[^"]+"' | head -1 | sed -E 's/.*"v([^"]+)".*/\1/')
          if [ -z "$UPSTREAM_VERSION" ]; then UPSTREAM_VERSION="2.0.999"; fi
          echo "Setting embedded version to $UPSTREAM_VERSION"
          sed -i "s|<Version>.*</Version>|<Version>$UPSTREAM_VERSION</Version>|" server/RdtClient.Web/RdtClient.Web.csproj
          sed -i "s|<AssemblyVersion>.*</AssemblyVersion>|<AssemblyVersion>$UPSTREAM_VERSION</AssemblyVersion>|" server/RdtClient.Web/RdtClient.Web.csproj

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rdt-client-seasonsplit
          tags: |
            type=raw,value=latest
            type=raw,value={{branch}}
            type=sha,prefix=sha-,format=short

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
